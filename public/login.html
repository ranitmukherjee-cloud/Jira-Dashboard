<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign in — PSV Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --b:#3B5BFF;--b2:#5B78FF;--bl:#EEF2FF;--b20:#D6DEFF;
    --n:#0B1220;--bg:#F5F7FB;--bdr:#E3E7EF;--bdr2:#C7CEDD;
    --t1:#0B1220;--t2:#3C4658;--t3:#7A869B;--r:#E11D48;--rb:#FEF1F4;
    --e2:0 8px 20px rgba(15,23,42,.10),0 2px 6px rgba(15,23,42,.06);
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:linear-gradient(135deg,#0B1220 0%,#141D33 55%,#0B1220 100%);
    color:var(--t1);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .card{background:#fff;border-radius:16px;box-shadow:var(--e2);padding:36px 34px 30px;width:100%;max-width:360px;}
  .brand{font-size:19px;font-weight:900;letter-spacing:-.3px;color:var(--n);margin-bottom:2px;}
  .brand .go{color:var(--b);}
  .sub{font-size:12px;color:var(--t3);margin-bottom:24px;}
  label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--t3);margin-bottom:6px;}
  .field{margin-bottom:16px;}
  input{width:100%;padding:10px 12px;font-size:13px;font-family:inherit;border:1.5px solid var(--bdr2);border-radius:9px;color:var(--t1);outline:none;transition:border-color .15s;}
  input:focus{border-color:var(--b);}
  button{width:100%;background:linear-gradient(135deg, var(--b) 0%, #7C3AED 100%);border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:800;color:#fff;cursor:pointer;margin-top:6px;transition:transform .12s ease,box-shadow .12s ease;}
  button:hover{transform:translateY(-1px);}
  button:disabled{opacity:.6;cursor:not-allowed;transform:none;}
  .err{background:var(--rb);color:var(--r);border-radius:8px;padding:9px 11px;font-size:11.5px;font-weight:600;margin-bottom:14px;display:none;}
  .err.show{display:block;}
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><span class="go">GO</span>COMET</div>
    <div class="sub">PSV Team Dashboard — sign in to continue</div>
    <div class="err" id="errBox"></div>
    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit" id="submitBtn">Sign in</button>
    </form>
  </div>
<script>
  const form = document.getElementById('loginForm');
  const errBox = document.getElementById('errBox');
  const submitBtn = document.getElementById('submitBtn');
  const params = new URLSearchParams(location.search);
  const redirectTo = params.get('from') && params.get('from').startsWith('/') ? params.get('from') : '/';

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errBox.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';
    try {
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Sign in failed');
      location.href = redirectTo;
    } catch (err) {
      errBox.textContent = err.message;
      errBox.classList.add('show');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
